// ---------- Helper: Wizard Punkteberechnung ----------
// Standardregel: richtige Vorhersage -> 20 + 10*Stiche
// falsche Vorhersage -> -10 * |Vorhersage - tatsächlich|
function calcPoints(prediction, actual) {
  if (prediction === actual) return 20 + 10 * actual;
  return -10 * Math.abs(prediction - actual);
}

// ---------- Helper: max Runden bei n Spielern (Standard-Wizard: 60 Karten) ----------
function maxRounds(numPlayers) {
  return Math.floor(60 / numPlayers);
}

// ---------- Prognosemodul ----------
// Nutzt: aktuellen Punktestand, Trend der letzten Runden (gewichteter Mittelwert der Rundenpunkte),
// und Vorhersagegenauigkeit (Trefferquote) jedes Spielers, um die erwartete Punktzahl
// am Spielende zu simulieren und daraus eine Gewinnwahrscheinlichkeit abzuleiten.
function computeForecast(players, rounds, currentRoundIndex, totalRounds) {
  const remaining = totalRounds - currentRoundIndex;
  if (rounds.length === 0) {
    const n = players.length;
    return players.map((p) => ({
      name: p.name,
      winProb: 1 / n,
      expectedFinal: 0,
      trend: 0,
      accuracy: 0,
    }));
  }

  const stats = players.map((p, pIdx) => {
    const roundPoints = rounds.map((r) => calcPoints(r.predictions[pIdx], r.actuals[pIdx]));
    const hits = rounds.filter((r) => r.predictions[pIdx] === r.actuals[pIdx]).length;
    const accuracy = hits / rounds.length;

    // gewichteter Mittelwert: jüngere Runden zählen mehr (exponentielle Gewichtung)
    let weightedSum = 0;
    let weightTotal = 0;
    roundPoints.forEach((pts, i) => {
      const weight = Math.pow(1.3, i); // spätere Runden (höherer i) wiegen mehr
      weightedSum += pts * weight;
      weightTotal += weight;
    });
    const avgPerRound = weightTotal > 0 ? weightedSum / weightTotal : 0;

    const currentTotal = roundPoints.reduce((a, b) => a + b, 0);
    // erwartete Endpunktzahl = aktueller Stand + erwarteter Schnitt * verbleibende Runden
    const expectedFinal = currentTotal + avgPerRound * remaining;

    return { name: p.name, currentTotal, avgPerRound, accuracy, expectedFinal };
  });

  // Unsicherheit: weniger gespielte Runden / verbleibende Runden -> mehr Varianz
  // Wir modellieren die Gewinnwahrscheinlichkeit via Softmax über erwarteten Endpunktzahlen,
  // skaliert mit einer "Temperatur" die mit verbleibenden Runden wächst (mehr Restrunden = mehr Unsicherheit = ausgeglichener)
  const temp = 25 + remaining * 18 + (rounds.length < 2 ? 40 : 0);
  const maxExp = Math.max(...stats.map((s) => s.expectedFinal));
  const expScores = stats.map((s) => Math.exp((s.expectedFinal - maxExp) / temp));
  const sumExp = expScores.reduce((a, b) => a + b, 0);

  return stats.map((s, i) => ({
    name: s.name,
    winProb: expScores[i] / sumExp,
    expectedFinal: Math.round(s.expectedFinal),
    trend: Math.round(s.avgPerRound),
    accuracy: s.accuracy,
  }));
}

function SetupScreen({ onStart, loadDebug, onImport }) {
  const [numPlayers, setNumPlayers] = useState(4);
  const [names, setNames] = useState(["", "", "", ""]);
  // Standard-Wizard-Regel: die Summe aller Vorhersagen darf nicht der Kartenanzahl entsprechen.
  // Standardmäßig aktiv, aber optional abschaltbar für Gruppen, die diese Variante nicht spielen.
  const [strictForbiddenSum, setStrictForbiddenSum] = useState(true);
  const [showImport, setShowImport] = useState(false);
  const [importCode, setImportCode] = useState("");
  const [importError, setImportError] = useState(null);

  const handleNumChange = (delta) => {
    const next = Math.min(6, Math.max(3, numPlayers + delta));
    setNumPlayers(next);
    setNames((prev) => {
      const copy = [...prev];
      while (copy.length < next) copy.push("");
      return copy.slice(0, next);
    });
  };

  const updateName = (idx, value) => {
    setNames((prev) => {
      const copy = [...prev];
      copy[idx] = value;
      return copy;
    });
  };

  const handleImportSubmit = () => {
    if (!importCode.trim()) return;
    try {
      const decoded = decodeGameState(importCode);
      if (!decoded.players || decoded.players.length === 0) {
        setImportError("Code enthält keinen gültigen Spielstand");
        return;
      }
      onImport(decoded);
    } catch (err) {
      setImportError("Code konnte nicht gelesen werden. Bitte vollständig kopiert einfügen.");
    }
  };

  const canStart = names.slice(0, numPlayers).every((n) => n.trim().length > 0);

  return (
    <div className="min-h-screen bg-[#15102a] text-[#f1e9d8] flex flex-col items-center justify-center px-6 py-12">
      <div className="w-full max-w-md">
        <WizardDuelArt />
        <div className="flex items-center justify-center gap-3 mb-2">
          <Wand2 className="w-8 h-8 text-[#d4af37]" strokeWidth={1.5} />
          <h1 className="font-display text-4xl tracking-wide">Wizard</h1>
        </div>
        <p className="text-center text-[#a99bc4] mb-6 font-body text-sm tracking-wide">
          Punktezähler &amp; Gewinnprognose
        </p>

        <div className="mb-6">
          {!showImport ? (
            <button
              onClick={() => setShowImport(true)}
              className="w-full flex items-center justify-center gap-2 text-sm font-body text-[#a99bc4] border border-dashed border-[#3a2d66] rounded-xl py-3 active:scale-[0.98] transition"
            >
              <ClipboardPaste className="w-4 h-4" /> Gespeicherten Spielstand fortsetzen
            </button>
          ) : (
            <div className="bg-[#1d1640]/80 border border-[#d4af37]/40 rounded-2xl p-5 backdrop-blur-sm">
              <p className="font-body text-xs uppercase tracking-[0.15em] text-[#a99bc4] mb-3">
                Code einfügen
              </p>
              <textarea
                value={importCode}
                onChange={(e) => {
                  setImportCode(e.target.value);
                  setImportError(null);
                }}
                placeholder="Hier den zuvor gesicherten Code einfügen…"
                className="w-full h-20 bg-[#15102a] border border-[#3a2d66] rounded-xl px-3 py-2 text-xs font-mono text-[#f1e9d8] placeholder-[#5c4f85] resize-none focus:outline-none focus:ring-2 focus:ring-[#d4af37]"
              />
              {importError && (
                <p className="text-xs font-body text-[#e08a8a] mt-2">{importError}</p>
              )}
              <div className="flex gap-2 mt-3">
                <button
                  onClick={() => {
                    setShowImport(false);
                    setImportCode("");
                    setImportError(null);
                  }}
                  className="flex-1 bg-transparent border border-[#3a2d66] text-[#a99bc4] font-body text-sm rounded-xl py-2.5 active:scale-[0.98] transition"
                >
                  Abbrechen
                </button>
                <button
                  onClick={handleImportSubmit}
                  className="flex-1 bg-[#d4af37] text-[#15102a] font-body font-semibold text-sm rounded-xl py-2.5 active:scale-[0.98] transition"
                >
                  Fortsetzen
                </button>
              </div>
            </div>
          )}
        </div>

        <div className="bg-[#1d1640]/80 border border-[#3a2d66] rounded-2xl p-6 mb-6 backdrop-blur-sm">
          <label className="block font-body text-xs uppercase tracking-[0.15em] text-[#a99bc4] mb-3">
            Anzahl Spieler
          </label>
          <div className="flex items-center justify-between bg-[#15102a] rounded-xl border border-[#3a2d66] px-4 py-3">
            <button
              onClick={() => handleNumChange(-1)}
              disabled={numPlayers <= 3}
              className="w-9 h-9 rounded-full flex items-center justify-center bg-[#3a2d66] text-[#f1e9d8] disabled:opacity-30 active:scale-95 transition"
              aria-label="Weniger Spieler"
            >
              <Minus className="w-4 h-4" />
            </button>
            <span className="font-display text-2xl text-[#d4af37]">{numPlayers}</span>
            <button
              onClick={() => handleNumChange(1)}
              disabled={numPlayers >= 6}
              className="w-9 h-9 rounded-full flex items-center justify-center bg-[#3a2d66] text-[#f1e9d8] disabled:opacity-30 active:scale-95 transition"
              aria-label="Mehr Spieler"
            >
              <Plus className="w-4 h-4" />
            </button>
          </div>
          <p className="text-xs text-[#7a6ca0] mt-2 font-body">
            {maxRounds(numPlayers)} Runden bei {numPlayers} Spielern (60 Karten)
          </p>
        </div>

        <div className="bg-[#1d1640]/80 border border-[#3a2d66] rounded-2xl p-6 mb-6 backdrop-blur-sm">
          <label className="block font-body text-xs uppercase tracking-[0.15em] text-[#a99bc4] mb-3">
            Spielernamen
          </label>
          <div className="space-y-3">
            {Array.from({ length: numPlayers }).map((_, idx) => (
              <input
                key={idx}
                type="text"
                value={names[idx] || ""}
                onChange={(e) => updateName(idx, e.target.value)}
                placeholder={`Spieler ${idx + 1}`}
                className="w-full bg-[#15102a] border border-[#3a2d66] rounded-xl px-4 py-3 text-[#f1e9d8] placeholder-[#5c4f85] font-body focus:outline-none focus:ring-2 focus:ring-[#d4af37] transition"
              />
            ))}
          </div>
        </div>

        <div
          className={`rounded-2xl p-6 mb-6 backdrop-blur-sm border transition-colors ${
            strictForbiddenSum
              ? "bg-[#d4af37]/[0.08] border-[#d4af37]/50"
              : "bg-[#1d1640]/80 border-[#3a2d66]"
          }`}
        >
          <p className="font-body text-xs uppercase tracking-[0.15em] text-[#a99bc4] mb-4">
            Spielregeln
          </p>
          <button
            onClick={() => setStrictForbiddenSum((v) => !v)}
            className="w-full flex items-center justify-between gap-4"
            aria-pressed={strictForbiddenSum}
          >
            <div className="text-left">
              <div className="flex items-center gap-2 flex-wrap">
                <p className="font-body text-sm font-semibold text-[#f1e9d8]">
                  Verbotene Summe
                </p>
                <span
                  className={`text-[10px] font-body font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full ${
                    strictForbiddenSum
                      ? "bg-[#d4af37] text-[#15102a]"
                      : "bg-[#3a2d66] text-[#a99bc4]"
                  }`}
                >
                  {strictForbiddenSum ? "Verschärfte Regel aktiv" : "Einfache Regel aktiv"}
                </span>
              </div>
              <p className="text-xs font-body text-[#a99bc4] mt-1.5 leading-relaxed">
                {strictForbiddenSum
                  ? "Vorhersagen dürfen in der Summe nicht der Kartenanzahl entsprechen"
                  : "Vorhersagen sind frei wählbar, auch wenn die Summe der Kartenanzahl entspricht"}
              </p>
            </div>
            <span
              className={`relative shrink-0 w-14 h-8 rounded-full border-2 transition-colors ${
                strictForbiddenSum
                  ? "bg-[#d4af37] border-[#f0d896]"
                  : "bg-[#241b4d] border-[#7a6ca0]"
              }`}
            >
              <span
                className={`absolute top-0.5 left-0.5 w-6 h-6 rounded-full shadow-md transition-transform ${
                  strictForbiddenSum ? "translate-x-6 bg-[#15102a]" : "translate-x-0 bg-[#f1e9d8]"
                }`}
              />
            </span>
          </button>
        </div>

        <button
          onClick={() =>
            onStart(names.slice(0, numPlayers).map((n) => n.trim()), numPlayers, strictForbiddenSum)
          }
          disabled={!canStart}
          className="w-full mt-8 bg-[#d4af37] disabled:bg-[#3a2d66] disabled:text-[#7a6ca0] text-[#15102a] font-body font-semibold tracking-wide rounded-xl py-4 flex items-center justify-center gap-2 active:scale-[0.98] transition"
        >
          Spiel beginnen <ChevronRight className="w-4 h-4" />
        </button>

        {loadDebug && (
          <p className="text-center text-[10px] font-body text-[#5c4f85] mt-4">{loadDebug}</p>
        )}
      </div>
    </div>
  );
}

// ---------- Komponente: Rundeneingabe ----------
// existingRound: falls gesetzt, wird eine bereits gespielte Runde bearbeitet (Korrektur-Modus).
// Im Korrektur-Modus werden Vorhersage und tatsächliche Stiche gleichzeitig angezeigt und
// sind beide editierbar, statt der zweistufigen Eingabe für eine neue Runde.
function RoundEntry({
  players,
  roundNumber,
  cardsThisRound,
  onSubmit,
  existingRound,
  isEditing,
  onCancelEdit,
  canGoBack,
  onGoBack,
  forbiddenSumRule,
}) {
  const initialPredictions = existingRound ? existingRound.predictions : players.map(() => 0);
  const initialActuals = existingRound ? existingRound.actuals : players.map(() => 0);

  const [predictions, setPredictions] = useState(initialPredictions);
  const [actuals, setActuals] = useState(initialActuals);
  // Neue Runde: zweistufig (erst Vorhersagen, dann Stiche). Korrektur: beide Werte sofort sichtbar.
  const [step, setStep] = useState(isEditing ? "both" : "predict");

  const updatePrediction = (idx, val) => {
    const clamped = Math.max(0, Math.min(cardsThisRound, val));
    setPredictions((prev) => prev.map((p, i) => (i === idx ? clamped : p)));
  };
  const updateActual = (idx, val) => {
    const clamped = Math.max(0, Math.min(cardsThisRound, val));
    setActuals((prev) => prev.map((p, i) => (i === idx ? clamped : p)));
  };

  const actualSum = actuals.reduce((a, b) => a + b, 0);
  const sumWarning = step !== "predict" && actualSum === cardsThisRound;

  // Wizard-Regel: die Summe aller Vorhersagen darf nicht exakt der Kartenanzahl der Runde
  // entsprechen ("verbotene Summe"). Gilt für die normale Vorhersage-Eingabe und für die
  // Korrektur bestehender Runden. Optional abschaltbar über forbiddenSumRule.
  const predictionSum = predictions.reduce((a, b) => a + b, 0);
  const predictionSumForbidden = forbiddenSumRule && predictionSum === cardsThisRound;
  const predictionStepActive = step === "predict" || step === "both";

  const canProceed = !(predictionStepActive && predictionSumForbidden);

  const handleNext = () => {
    if (!canProceed) return;
    if (step === "predict") {
      setStep("actual");
      setActuals(predictions.map(() => 0));
    } else {
      onSubmit({ predictions, actuals });
    }
  };

  const title =
    step === "predict" ? "Vorhersagen" : step === "actual" ? "Tatsächliche Stiche" : "Vorhersage & Stiche";

  return (
    <div
      className={`bg-[#1d1640]/80 border rounded-2xl p-6 backdrop-blur-sm ${
        isEditing ? "border-[#d4af37]/60" : "border-[#3a2d66]"
      }`}
    >
      <div className="flex items-center justify-between mb-1">
        <div className="flex items-center gap-2">
          {canGoBack && !isEditing && (
            <button
              onClick={onGoBack}
              className="w-7 h-7 rounded-full flex items-center justify-center bg-[#3a2d66] text-[#f1e9d8] active:scale-95 transition shrink-0"
              aria-label="Vorherige Runde anzeigen"
            >
              <ChevronLeft className="w-4 h-4" />
            </button>
          )}
          <h2 className="font-display text-2xl text-[#f1e9d8]">Runde {roundNumber}</h2>
        </div>
        <span className="text-xs font-body uppercase tracking-[0.15em] text-[#a99bc4]">
          {cardsThisRound} {cardsThisRound === 1 ? "Karte" : "Karten"}
        </span>
      </div>
      <div className="flex items-center justify-between mb-5">
        <p className="text-[#a99bc4] font-body text-sm">{title}</p>
        {isEditing && (
          <span className="text-[10px] font-body uppercase tracking-wide text-[#d4af37] bg-[#d4af37]/10 px-2 py-0.5 rounded-full">
            Korrektur
          </span>
        )}
      </div>

      <div className="space-y-3">
        {players.map((p, idx) => {
          const hitNow = actuals[idx] === predictions[idx];

          // ---- Korrektur-Modus: beide Werte parallel, klar getrennt ----
          if (step === "both") {
            return (
              <div
                key={idx}
                className="bg-[#15102a] border border-[#3a2d66] rounded-xl px-4 py-3"
              >
                <div className="flex items-center justify-between mb-2.5">
                  <span className="font-body text-[#f1e9d8] truncate mr-2">{p}</span>
                  {hitNow && (
                    <span className="text-[10px] font-body text-[#7fd49a] shrink-0">✓ Treffer</span>
                  )}
                </div>
                <div className="flex items-center justify-between gap-4">
                  <div className="flex-1">
                    <p className="text-xs font-body font-medium uppercase tracking-wide text-[#c9bfe0] mb-1.5">
                      Vorhersage
                    </p>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => updatePrediction(idx, predictions[idx] - 1)}
                        className="w-7 h-7 rounded-full flex items-center justify-center bg-[#3a2d66] text-[#f1e9d8] active:scale-95 transition"
                        aria-label="Vorhersage verringern"
                      >
                        <Minus className="w-3 h-3" />
                      </button>
                      <span className="font-display text-lg text-[#a99bc4] w-5 text-center">
                        {predictions[idx]}
                      </span>
                      <button
                        onClick={() => updatePrediction(idx, predictions[idx] + 1)}
                        className="w-7 h-7 rounded-full flex items-center justify-center bg-[#3a2d66] text-[#f1e9d8] active:scale-95 transition"
                        aria-label="Vorhersage erhöhen"
                      >
                        <Plus className="w-3 h-3" />
                      </button>
                    </div>
                  </div>
                  <div className="flex-1">
                    <p className="text-xs font-body font-medium uppercase tracking-wide text-[#c9bfe0] mb-1.5">
                      Tatsächlich
                    </p>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => updateActual(idx, actuals[idx] - 1)}
                        className="w-7 h-7 rounded-full flex items-center justify-center bg-[#3a2d66] text-[#f1e9d8] active:scale-95 transition"
                        aria-label="Stiche verringern"
                      >
                        <Minus className="w-3 h-3" />
                      </button>
                      <span
                        className={`font-display text-lg w-5 text-center ${
                          hitNow ? "text-[#7fd49a]" : "text-[#d4af37]"
                        }`}
                      >
                        {actuals[idx]}
                      </span>
                      <button
                        onClick={() => updateActual(idx, actuals[idx] + 1)}
                        className="w-7 h-7 rounded-full flex items-center justify-center bg-[#3a2d66] text-[#f1e9d8] active:scale-95 transition"
                        aria-label="Stiche erhöhen"
                      >
                        <Plus className="w-3 h-3" />
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          // ---- Normale neue Runde: zweistufige Eingabe ----
          const value = step === "predict" ? predictions[idx] : actuals[idx];
          const update = step === "predict" ? updatePrediction : updateActual;
          return (
            <div
              key={idx}
              className="flex items-center justify-between bg-[#15102a] border border-[#3a2d66] rounded-xl px-4 py-3"
            >
              <div className="flex flex-col mr-3 min-w-0">
                <span className="font-body text-[#f1e9d8] truncate">{p}</span>
                {step === "actual" && (
                  <span className="text-xs font-body text-[#a99bc4] mt-0.5">
                    Vorhersage: <span className="text-[#d4d0e6] font-semibold">{predictions[idx]}</span>
                    {hitNow && <span className="text-[#7fd49a] ml-1.5 font-medium">✓ Treffer</span>}
                  </span>
                )}
              </div>
              <div className="flex items-center gap-3 shrink-0">
                <button
                  onClick={() => update(idx, value - 1)}
                  className="w-8 h-8 rounded-full flex items-center justify-center bg-[#3a2d66] text-[#f1e9d8] active:scale-95 transition"
                  aria-label="Wert verringern"
                >
                  <Minus className="w-3.5 h-3.5" />
                </button>
                <span
                  className={`font-display text-xl w-6 text-center ${
                    hitNow && step === "actual" ? "text-[#7fd49a]" : "text-[#d4af37]"
                  }`}
                >
                  {value}
                </span>
                <button
                  onClick={() => update(idx, value + 1)}
                  className="w-8 h-8 rounded-full flex items-center justify-center bg-[#3a2d66] text-[#f1e9d8] active:scale-95 transition"
                  aria-label="Wert erhöhen"
                >
                  <Plus className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          );
        })}
      </div>

      {predictionStepActive && (
        <p
          className={`text-xs font-body mt-3 ${
            predictionSumForbidden ? "text-[#e08a8a]" : "text-[#a99bc4]"
          }`}
        >
          Summe Vorhersagen: {predictionSum} / {cardsThisRound}
          {predictionSumForbidden && (
            <span className="block text-[#e08a8a] mt-1">
              Verboten: Die Summe aller Vorhersagen darf nicht genau {cardsThisRound} ergeben.
              Bitte eine Vorhersage anpassen.
            </span>
          )}
        </p>
      )}

      {(step === "actual" || step === "both") && (
        <p
          className={`text-xs font-body mt-3 ${
            sumWarning ? "text-[#7fd49a]" : "text-[#a99bc4]"
          }`}
        >
          Summe Stiche: {actualSum} / {cardsThisRound} {sumWarning ? "✓" : ""}
        </p>
      )}

      <div className="flex gap-3 mt-6">
        {isEditing && (
          <button
            onClick={onCancelEdit}
            className="flex-1 bg-transparent border border-[#3a2d66] text-[#a99bc4] font-body font-medium tracking-wide rounded-xl py-3.5 active:scale-[0.98] transition"
          >
            Abbrechen
          </button>
        )}
        <button
          onClick={handleNext}
          disabled={!canProceed}
          className="flex-1 bg-[#d4af37] disabled:bg-[#3a2d66] disabled:text-[#7a6ca0] text-[#15102a] font-body font-semibold tracking-wide rounded-xl py-3.5 flex items-center justify-center gap-2 active:scale-[0.98] transition"
        >
          {isEditing
            ? "Speichern"
            : step === "predict"
            ? "Weiter zu Ergebnissen"
            : "Runde abschließen"}
          {!isEditing && <ChevronRight className="w-4 h-4" />}
        </button>
      </div>
    </div>
  );
}

// ---------- Komponente: Kristallkugel-Prognose ----------
function CrystalBall({ forecast }) {
  const sorted = [...forecast].sort((a, b) => b.winProb - a.winProb);
  const leader = sorted[0];

  return (
    <div className="bg-[#1d1640]/80 border border-[#3a2d66] rounded-2xl p-6 backdrop-blur-sm">
      <div className="flex items-center gap-2 mb-5">
        <Sparkles className="w-5 h-5 text-[#d4af37]" strokeWidth={1.5} />
        <h2 className="font-display text-xl text-[#f1e9d8]">Gewinnprognose</h2>
      </div>

      <div className="space-y-4">
        {sorted.map((f, idx) => {
          const pct = Math.round(f.winProb * 100);
          return (
            <div key={f.name}>
              <div className="flex items-center justify-between mb-1.5">
                <div className="flex items-center gap-2">
                  {idx === 0 && <Crown className="w-3.5 h-3.5 text-[#d4af37]" />}
                  <span className="font-body text-sm text-[#f1e9d8]">{f.name}</span>
                </div>
                <span className="font-display text-sm text-[#d4af37]">{pct}%</span>
              </div>
              <div className="h-2.5 rounded-full bg-[#15102a] border border-[#3a2d66] overflow-hidden">
                <div
                  className="h-full rounded-full transition-all duration-700"
                  style={{
                    width: `${pct}%`,
                    background: "linear-gradient(90deg, #6b4fa0, #d4af37)",
                  }}
                />
              </div>
              <div className="flex items-center gap-4 mt-1 text-[10px] font-body text-[#7a6ca0] uppercase tracking-wide">
                <span>Erw. Endstand: {f.expectedFinal}</span>
                <span className="flex items-center gap-1">
                  <TrendingUp className="w-2.5 h-2.5" /> Ø {f.trend}/Runde
                </span>
                <span>Trefferquote {Math.round(f.accuracy * 100)}%</span>
              </div>
            </div>
          );
        })}
      </div>

      <p className="text-[10px] font-body text-[#5c4f85] mt-5 leading-relaxed">
        Prognose basiert auf gewichtetem Punkteschnitt (jüngere Runden zählen stärker), aktuellem
        Punktestand und verbleibenden Runden. Wahrscheinlichkeiten gleichen sich an, je mehr Runden
        noch offen sind.
      </p>
    </div>
  );
}

// ---------- Komponente: Punktetabelle (Übersicht aller Runden) ----------
function ScoreTable({ players, rounds, onEditRound }) {
  const totals = players.map((_, idx) =>
    rounds.reduce((sum, r) => sum + calcPoints(r.predictions[idx], r.actuals[idx]), 0)
  );
  const maxTotal = rounds.length ? Math.max(...totals) : 0;

  // Rang je Spieler (1 = Führung)
  const ranked = [...totals]
    .map((t, idx) => ({ idx, t }))
    .sort((a, b) => b.t - a.t);
  const rankOf = {};
  ranked.forEach((r, pos) => {
    rankOf[r.idx] = pos + 1;
  });

  return (
    <div className="bg-[#1d1640]/80 border border-[#3a2d66] rounded-2xl overflow-hidden backdrop-blur-sm">
      <div className="flex items-center gap-2 px-6 pt-6 pb-4">
        <Trophy className="w-5 h-5 text-[#d4af37]" strokeWidth={1.5} />
        <h2 className="font-display text-xl text-[#f1e9d8]">Rundenübersicht</h2>
      </div>

      {/* Rang-Leiste */}
      <div className="px-6 pb-4 flex flex-wrap gap-2">
        {players.map((p, idx) => {
          const isLeader = totals[idx] === maxTotal && rounds.length > 0;
          return (
            <div
              key={p}
              className={`flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-body border ${
                isLeader
                  ? "bg-gradient-to-r from-[#6b4fa0]/40 to-[#d4af37]/30 border-[#d4af37]/60 text-[#f1e9d8]"
                  : "bg-[#15102a] border-[#3a2d66] text-[#a99bc4]"
              }`}
            >
              {isLeader && <Crown className="w-3 h-3 text-[#d4af37]" />}
              <span className="font-medium">{p}</span>
              <span className="text-[#d4af37] font-display">{totals[idx]}</span>
              <span className="text-[#5c4f85]">#{rankOf[idx]}</span>
            </div>

      <div className="overflow-x-auto">
        <table className="w-full text-sm font-body min-w-[480px]">
          <thead>

                    {rIdx + 1}

                        <div className="inline-flex items-center gap-1 rounded-md px-1.5 py-0.5 font-body text-[11px] text-[#a99bc4] bg-[#15102a]/60">

                  <td className="pr-3 pl-1">
                    <button
                      onClick={() => onEditRound(rIdx)}
                      className="flex items-center justify-center w-7 h-7 rounded-full bg-[#3a2d66] text-[#a99bc4] hover:bg-[#d4af37] hover:text-[#15102a] active:scale-95 transition"
                      aria-label={`Runde ${rIdx + 1} bearbeiten`}

          <tfoot>
            <tr className="border-t-2 border-[#d4af37]/50 bg-[#15102a]/40">
              <td className="py-3 pl-6 pr-2 font-display text-[#f1e9d8] sticky left-0 bg-[#15102a]/95">
                Total
              </td>
              {totals.map((t, idx) => (
                <td
                  key={idx}
                  className={`py-3 px-3 text-center font-display text-lg ${
                    t === maxTotal && rounds.length > 0 ? "text-[#d4af37]" : "text-[#f1e9d8]"
                  }`}
                >
                  {t}
                </td>
              ))}
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div className="flex flex-wrap items-center gap-x-5 gap-y-1.5 px-6 pb-5 pt-1">
        <span className="flex items-center gap-1.5 text-xs font-body text-[#a99bc4]">
          <span className="w-2.5 h-2.5 rounded-full bg-[#a99bc4] inline-block" />
          <strong className="text-[#d4d0e6] font-semibold">Vorhersage</strong>
          <span className="opacity-60">→</span>
          <strong className="text-[#d4d0e6] font-semibold">Tatsächliche Stiche</strong>
        </span>
        <span className="flex items-center gap-1.5 text-xs font-body text-[#7fd49a]">
          <Check className="w-3 h-3" strokeWidth={2.5} /> Treffer
        </span>
        <span className="text-xs font-body text-[#5c4f85]">
          Stift-Symbol öffnet die Runde zur Korrektur
        </span>
      </div>
    </div>
  );
}

// ---------- Komponente: Punkteverlauf als Liniendiagramm ----------
// Eine eigene Farbe je Spieler, abgerundete (monotone) Linien statt scharfer Eckpunkte.
const CHART_COLORS = ["#c9a646", "#8a72b8", "#6fae8a", "#6f9bb0", "#b87f7f", "#b8966f"];

function ScoreChart({ players, rounds }) {
  // Kumulierte Punktestände je Runde aufbauen, Runde 0 = Start bei 0 Punkten
  const data = useMemo(() => {
    const running = players.map(() => 0);
    const points = [
      { round: 0, ...Object.fromEntries(players.map((p) => [p, 0])) },
    ];
    rounds.forEach((r, rIdx) => {
      players.forEach((_, pIdx) => {
        running[pIdx] += calcPoints(r.predictions[pIdx], r.actuals[pIdx]);
      });
      points.push({
        round: rIdx + 1,
        ...Object.fromEntries(players.map((p, pIdx) => [p, running[pIdx]])),
      });
    });
    return points;
  }, [players, rounds]);

  return (
    <div className="bg-[#1d1640]/80 border border-[#3a2d66] rounded-2xl p-6 backdrop-blur-sm">
      <div className="flex items-center gap-2 mb-5">
        <LineChartIcon className="w-5 h-5 text-[#d4af37]" strokeWidth={1.5} />
        <h2 className="font-display text-xl text-[#f1e9d8]">Punkteverlauf</h2>
      </div>
      <div className="w-full h-72">
        <ResponsiveContainer width="100%" height="100%">
          <LineChart data={data} margin={{ top: 5, right: 12, left: -12, bottom: 0 }}>
            <CartesianGrid stroke="#3a2d66" strokeDasharray="3 3" opacity={0.5} />
            <XAxis
              dataKey="round"
              stroke="#7a6ca0"
              tick={{ fill: "#a99bc4", fontSize: 11, fontFamily: "Inter, sans-serif" }}
              label={{
                value: "Runde",
                position: "insideBottom",
                offset: -2,
                fill: "#7a6ca0",
                fontSize: 11,
              }}
            />
            <YAxis
              stroke="#7a6ca0"
              tick={{ fill: "#a99bc4", fontSize: 11, fontFamily: "Inter, sans-serif" }}
            />
            <Tooltip
              contentStyle={{
                backgroundColor: "#15102a",
                border: "1px solid #3a2d66",
                borderRadius: "8px",
                fontFamily: "Inter, sans-serif",
                fontSize: "12px",
              }}
              labelStyle={{ color: "#a99bc4" }}
              labelFormatter={(value) => `Runde ${value}`}
            />
            <Legend
              wrapperStyle={{ fontFamily: "Inter, sans-serif", fontSize: "12px", color: "#a99bc4" }}
            />
            {players.map((p, idx) => (
              <Line
                key={p}
                type="monotone"
                dataKey={p}
                stroke={CHART_COLORS[idx % CHART_COLORS.length]}
                strokeWidth={2}
                strokeLinecap="round"
                strokeLinejoin="round"
                dot={{ r: 2.5, strokeWidth: 0 }}
                activeDot={{ r: 4 }}
              />
            ))}
          </LineChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

// ---------- Export/Import als zuverlässige Alternative zur Storage-API ----------
// Auf manchen Plattformen (insbesondere mobil) ist window.storage nicht durchgängig verfügbar.
// Als zuverlässige Alternative lässt sich der Spielstand als kompakter Code exportieren und beim
// nächsten Öffnen wieder einfügen, unabhängig von einer funktionierenden Storage-API.
function encodeGameState(state) {
  try {
    const json = JSON.stringify(state);
    return btoa(encodeURIComponent(json));
  } catch (err) {
    return null;
  }
}

function decodeGameState(code) {
  const json = decodeURIComponent(atob(code.trim()));
  return JSON.parse(json);
}

// ---------- Komponente: Spielstand-Code anzeigen und kopieren ----------
function ExportModal({ state, onClose }) {
  const [copied, setCopied] = useState(false);
  const code = useMemo(() => encodeGameState(state) || "", [state]);

  const handleCopy = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(code);
      } else {
        // Fallback, falls die Clipboard-API nicht verfügbar ist
        const textarea = document.createElement("textarea");
        textarea.value = code;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (err) {
      // Kopieren fehlgeschlagen -> Nutzer kann den Code weiterhin manuell markieren
    }
  };

  return (
    <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center px-4 z-50">
      <div className="bg-[#1d1640] border border-[#3a2d66] rounded-2xl p-6 w-full max-w-md max-h-[85vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-display text-xl text-[#f1e9d8] flex items-center gap-2">
            <Save className="w-5 h-5 text-[#d4af37]" strokeWidth={1.5} /> Spielstand sichern
          </h2>
          <button
            onClick={onClose}
            className="w-7 h-7 rounded-full flex items-center justify-center bg-[#3a2d66] text-[#a99bc4] active:scale-95 transition"
            aria-label="Schließen"
          >
            <X className="w-3.5 h-3.5" />
          </button>
        </div>
        <p className="text-xs font-body text-[#a99bc4] mb-4 leading-relaxed">
          Kopiere diesen Code und speichere ihn (z. B. in den Notizen). Falls das Spiel beim
          Schließen der App nicht automatisch erhalten bleibt, kannst du ihn beim nächsten Öffnen
          über "Code einfügen" im Startbildschirm wiederherstellen.
        </p>
        <textarea
          readOnly
          value={code}
          onClick={(e) => e.target.select()}
          className="w-full h-28 bg-[#15102a] border border-[#3a2d66] rounded-xl px-3 py-2 text-[10px] font-mono text-[#a99bc4] resize-none focus:outline-none focus:ring-2 focus:ring-[#d4af37]"
        />
        <button
          onClick={handleCopy}
          className="w-full mt-4 bg-[#d4af37] text-[#15102a] font-body font-semibold tracking-wide rounded-xl py-3 flex items-center justify-center gap-2 active:scale-[0.98] transition"
        >
          <Copy className="w-4 h-4" /> {copied ? "Kopiert!" : "Code kopieren"}
        </button>
      </div>
    </div>
  );
}

// ---------- Persistenz: Storage-Key für den laufenden Spielstand ----------
const SAVE_KEY = "wizard:current-game";

// ---------- Haupt-App ----------
function WizardApp() {
  const [phase, setPhase] = useState("setup");
  const [players, setPlayers] = useState([]);
  const [numPlayers, setNumPlayers] = useState(4);
  const [rounds, setRounds] = useState([]);
  const [editingRoundIndex, setEditingRoundIndex] = useState(null);
  const [forbiddenSumRule, setForbiddenSumRule] = useState(true);
  const [isLoaded, setIsLoaded] = useState(false);
  const [loadDebug, setLoadDebug] = useState(null);
  const [showExportModal, setShowExportModal] = useState(false);
  const [showSaveReminder, setShowSaveReminder] = useState(false);
  const hasLoadedRef = useRef(false);
  const latestStateRef = useRef(null);
  latestStateRef.current = { players, numPlayers, rounds, phase, editingRoundIndex, forbiddenSumRule };

  // --- Speichern: URL-Hash (primär) + window.storage (stiller Hintergrund-Versuch) ---
  const persistState = (state) => {
    if (state.phase === "setup" && state.players.length === 0) {
      try { window.history.replaceState(null, "", window.location.pathname); } catch (e) {}
      try { window.storage.delete(SAVE_KEY, false).catch(() => {}); } catch (e) {}
      return;
    }
    const encoded = encodeGameState(state);
    if (encoded) {
      try { window.location.hash = encoded; } catch (e) {}
    }
    try { window.storage.set(SAVE_KEY, JSON.stringify(state), false).catch(() => {}); } catch (e) {}
  };

  // --- Laden: URL-Hash (primär) → window.storage (Fallback) ---
  useEffect(() => {
    let isMounted = true;
    const applyState = (saved) => {
      if (!saved || !saved.players || saved.players.length === 0) return false;
      setPlayers(saved.players);
      setNumPlayers(saved.numPlayers || saved.players.length);
      setRounds(saved.rounds || []);
      setPhase(saved.phase || "playing");
      setEditingRoundIndex(typeof saved.editingRoundIndex === "number" ? saved.editingRoundIndex : null);
      setForbiddenSumRule(typeof saved.forbiddenSumRule === "boolean" ? saved.forbiddenSumRule : true);
      setLoadDebug(`✓ Geladen: ${saved.players.length} Spieler, ${(saved.rounds||[]).length} Runden`);
      return true;
    };

    (async () => {
      // 1. URL-Hash versuchen
      try {
        const hash = window.location.hash.slice(1);
        if (hash && hash.length > 10) {
          const saved = decodeGameState(hash);
          if (applyState(saved)) {
            hasLoadedRef.current = true;
            if (isMounted) setIsLoaded(true);
            return;
          }
        }
      } catch (e) {}

      // 2. window.storage als Fallback
      try {
        const result = await Promise.race([
          window.storage.get(SAVE_KEY, false),
          new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 3000)),
        ]);
        if (result && result.value) {
          const saved = JSON.parse(result.value);
          if (applyState(saved)) {
            hasLoadedRef.current = true;
            if (isMounted) setIsLoaded(true);
            return;
          }
        }
      } catch (e) {}

      // 3. Nichts gefunden → frisches Setup
      hasLoadedRef.current = true;
      if (isMounted) setIsLoaded(true);
    })();

    return () => { isMounted = false; };
  }, []);

  // Nach jeder Zustandsänderung sofort speichern
  useEffect(() => {
    if (!hasLoadedRef.current) return;
    persistState(latestStateRef.current);
  }, [players, numPlayers, rounds, phase, editingRoundIndex, forbiddenSumRule]);

  // Beim Hintergrund-Wechsel nochmals persistieren (Hash-Setzung ist synchron, kein Timing-Problem)
  useEffect(() => {
    const flush = () => {
      if (!hasLoadedRef.current) return;
      persistState(latestStateRef.current);
    };
    const handleVisibility = () => { if (document.visibilityState === "hidden") flush(); };
    window.addEventListener("pagehide", flush);
    document.addEventListener("visibilitychange", handleVisibility);
    return () => {
      window.removeEventListener("pagehide", flush);
      document.removeEventListener("visibilitychange", handleVisibility);
    };
  }, []);

  const totalRounds = numPlayers > 0 ? maxRounds(numPlayers) : 0;
  const nextRoundNumber = rounds.length + 1;
  const isEditingExisting = editingRoundIndex !== null;
  const displayedRoundNumber = isEditingExisting ? editingRoundIndex + 1 : nextRoundNumber;
  const cardsThisRound = displayedRoundNumber;

  // Prognose berücksichtigt nur abgeschlossene Runden, unabhängig davon, welche Runde gerade zur
  // Korrektur geöffnet ist
  const forecast = useMemo(() => {
    if (players.length === 0) return [];
    return computeForecast(
      players.map((name) => ({ name })),
      rounds,
      rounds.length,
      totalRounds
    );
  }, [players, rounds, totalRounds]);

  const totals = useMemo(
    () =>
      players.map((_, idx) =>
        rounds.reduce((sum, r) => sum + calcPoints(r.predictions[idx], r.actuals[idx]), 0)
      ),
    [players, rounds]
  );

  const handleStart = (names, n, ruleEnabled) => {
    setPlayers(names);
    setNumPlayers(n);
    setRounds([]);
    setEditingRoundIndex(null);
    setForbiddenSumRule(ruleEnabled);
    setPhase("playing");
  };

  const handleRoundSubmit = (roundData) => {
    // Zweite Absicherung (unabhängig vom internen Eingabe-Schritt in RoundEntry):
    // Bei aktiver "verbotene Summe"-Regel darf die Vorhersagesumme nie der Kartenanzahl der
    // jeweiligen Runde entsprechen. Falls doch, wird die Runde nicht übernommen.
    const targetRoundNumber = isEditingExisting ? editingRoundIndex + 1 : nextRoundNumber;
    const predictionSum = roundData.predictions.reduce((a, b) => a + b, 0);
    if (forbiddenSumRule && predictionSum === targetRoundNumber) {
      return;
    }

    let updatedRounds;
    let updatedPhase = phase;
    if (isEditingExisting) {
      // bestehende Runde korrigieren
      updatedRounds = rounds.map((r, i) => (i === editingRoundIndex ? roundData : r));
      setRounds(updatedRounds);
      setEditingRoundIndex(null);
    } else {
      updatedRounds = [...rounds, roundData];
      setRounds(updatedRounds);
      if (updatedRounds.length >= totalRounds) {
        updatedPhase = "finished";
        setPhase("finished");
      }
    }

    // Sofort speichern, statt nur auf den useEffect zu warten: das Abschließen einer Runde ist
    // der wichtigste Moment, an dem Fortschritt nicht verloren gehen darf.
    persistState({
      players,
      numPlayers,
      rounds: updatedRounds,
      phase: updatedPhase,
      editingRoundIndex: isEditingExisting ? null : editingRoundIndex,
      forbiddenSumRule,
    }).catch(() => {});

    // Nutzer auf iOS zum manuellen Speichern erinnern (window.storage nicht immer verfügbar)
    setShowSaveReminder(true);
  };

  const handleGoBack = () => {
    if (rounds.length === 0) return;
    setEditingRoundIndex(rounds.length - 1);
  };

  const handleEditRound = (idx) => {
    setEditingRoundIndex(idx);
  };

  const handleCancelEdit = () => {
    setEditingRoundIndex(null);
  };

  const handleReset = () => {
    setPhase("setup");
    setPlayers([]);
    setRounds([]);
    setEditingRoundIndex(null);
    setForbiddenSumRule(true);
  };

  const handleImport = (decoded) => {
    setPlayers(decoded.players);
    setNumPlayers(decoded.numPlayers || decoded.players.length);
    setRounds(decoded.rounds || []);
    setPhase(decoded.phase || "playing");
    setEditingRoundIndex(
      typeof decoded.editingRoundIndex === "number" ? decoded.editingRoundIndex : null
    );
    setForbiddenSumRule(
      typeof decoded.forbiddenSumRule === "boolean" ? decoded.forbiddenSumRule : true
    );
  };

  if (!isLoaded) {
    return (
      <>
        <FontLoader />
        <div className="min-h-screen bg-[#15102a] flex items-center justify-center">
          <Wand2 className="w-8 h-8 text-[#d4af37] animate-pulse" strokeWidth={1.5} />
        </div>
      </>
    );
  }

  if (phase === "setup") {
    return (
      <>
        <FontLoader />
        <SetupScreen onStart={handleStart} loadDebug={loadDebug} onImport={handleImport} />
      </>
    );
  }

  const winnerIdx = totals.length ? totals.indexOf(Math.max(...totals)) : -1;
  const showFinishedBanner = phase === "finished" && !isEditingExisting;

  return (
    <>
      <FontLoader />
      <div className="min-h-screen bg-[#15102a] text-[#f1e9d8] px-4 py-8 sm:px-6">
        <div className="max-w-2xl mx-auto">
          <div className="flex items-center justify-between mb-6 gap-2">
            <div className="flex items-center gap-2">
              <Wand2 className="w-6 h-6 text-[#d4af37]" strokeWidth={1.5} />
              <h1 className="font-display text-2xl tracking-wide">Wizard</h1>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowExportModal(true)}
                className="flex items-center gap-1.5 text-xs font-body text-[#d4af37] border border-[#d4af37]/50 rounded-full px-3 py-1.5 active:scale-95 transition"
              >
                <Save className="w-3 h-3" /> Sichern
              </button>
              <button
                onClick={handleReset}
                className="flex items-center gap-1.5 text-xs font-body text-[#a99bc4] border border-[#3a2d66] rounded-full px-3 py-1.5 active:scale-95 transition"
              >
                <RotateCcw className="w-3 h-3" /> Neues Spiel
              </button>
            </div>
          </div>

          {showSaveReminder && (
            <div className="bg-[#d4af37]/15 border border-[#d4af37]/60 rounded-xl px-4 py-3 mb-5 flex items-center justify-between gap-3">
              <div className="flex items-center gap-2 min-w-0">
                <Save className="w-4 h-4 text-[#d4af37] shrink-0" />
                <p className="text-xs font-body text-[#f1e9d8]">
                  Spielstand jetzt sichern, damit er beim Schließen nicht verloren geht
                </p>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <button
                  onClick={() => { setShowExportModal(true); setShowSaveReminder(false); }}
                  className="text-xs font-body font-semibold text-[#15102a] bg-[#d4af37] rounded-lg px-3 py-1.5 active:scale-95 transition whitespace-nowrap"
                >
                  Jetzt sichern
                </button>
                <button
                  onClick={() => setShowSaveReminder(false)}
                  className="text-[#a99bc4] active:scale-95 transition"
                  aria-label="Schließen"
                >
                  <X className="w-4 h-4" />
                </button>
              </div>
            </div>
          )}



          {showFinishedBanner && (
            <div className="bg-[#1d1640]/80 border border-[#d4af37]/50 rounded-2xl p-6 mb-6 text-center backdrop-blur-sm">
              <Crown className="w-10 h-10 text-[#d4af37] mx-auto mb-3" strokeWidth={1.5} />
              <p className="text-[#a99bc4] font-body text-sm uppercase tracking-[0.15em] mb-1">
                Gewinner
              </p>
              <h2 className="font-display text-3xl text-[#f1e9d8]">{players[winnerIdx]}</h2>
              <p className="font-body text-[#d4af37] mt-1">{totals[winnerIdx]} Punkte</p>
            </div>
          )}

          {(phase !== "finished" || isEditingExisting) && (
            <div className="mb-6">
              <RoundEntry
                key={isEditingExisting ? `edit-${editingRoundIndex}` : `new-${nextRoundNumber}`}
                players={players}
                roundNumber={displayedRoundNumber}
                cardsThisRound={cardsThisRound}
                onSubmit={handleRoundSubmit}
                existingRound={isEditingExisting ? rounds[editingRoundIndex] : null}
                isEditing={isEditingExisting}
                onCancelEdit={handleCancelEdit}
                canGoBack={rounds.length > 0}
                onGoBack={handleGoBack}
                forbiddenSumRule={forbiddenSumRule}
              />
              <p className="text-center text-xs font-body text-[#5c4f85] mt-3">
                {isEditingExisting
                  ? `Korrektur von Runde ${displayedRoundNumber} von ${totalRounds}`
                  : `Runde ${displayedRoundNumber} von ${totalRounds}`}
              </p>
            </div>
          )}

          {rounds.length > 0 && (
            <div className="mb-6">
              <ScoreTable players={players} rounds={rounds} onEditRound={handleEditRound} />
            </div>
          )}

          {forecast.length > 0 && !showFinishedBanner && (
            <div className="mb-6">
              <CrystalBall forecast={forecast} />
            </div>
          )}

          {rounds.length > 0 && (
            <div>
              <ScoreChart players={players} rounds={rounds} />
            </div>
          )}
        </div>
      </div>

      {showExportModal && (
        <ExportModal
          state={{ players, numPlayers, rounds, phase, editingRoundIndex, forbiddenSumRule }}
          onClose={() => setShowExportModal(false)}
        />
      )}
    </>
  );
}

// ---------- Fonts ----------
function FontLoader() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
      .font-display { font-family: 'Cormorant Garamond', serif; }
      .font-body { font-family: 'Inter', sans-serif; }
      /* Globaler Fallback: alles erbt standardmäßig Inter, sofern nicht explizit font-display gesetzt ist.
         Verhindert, dass einzelne Texte ohne Font-Klasse auf eine System-Schrift zurückfallen. */
      html, body, #root, #app, div, p, span, button, input, label, strong, td, th, table {
        font-family: 'Inter', sans-serif;
        color: #f1e9d8;
      }
      /* Eingabefelder explizit: Placeholder bleibt gedimmt, eigentlicher Text weiß */
      input, textarea {
        color: #f1e9d8;
      }
      input::placeholder, textarea::placeholder {
        color: #5c4f85;
      }
    `}</style>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WizardApp />);
  </script>
